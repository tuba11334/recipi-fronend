trigger:
- main

pool:
  vmImage: 'ubuntu-latest'

stages:
- stage: Build
  jobs:
  - job: BuildJob
    steps:
    - script: echo "No build needed - static HTML/CSS/JS"
      displayName: 'Build step (placeholder)'

- stage: Deploy
  dependsOn: Build
  jobs:
  - job: DeployJob
    steps:
    - task: AzureStaticWebApp@0
      inputs:
        app_location: 'frontend'
        output_location: ''
        azure_static_web_apps_api_token: $(SWA_TOKEN)
